name: CLI update broke something
description: Even Keel worked, then an agent's CLI (Claude Code, Codex, OpenCode, Copilot) updated and a part of it stopped working.
title: "<CLI> <version>: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Even Keel reads undocumented parts of the agents' CLIs — for Claude Code `claude agents --json`, `sessions/<pid>.json`, the background daemon, the transcript format, the text of `/usage`, `~/.claude.json`; for Codex, OpenCode and Copilot their JSON events and session files — so a CLI update can break it until it is adapted. The README names the versions it was last checked on; **CLI version → Checked** on the page runs sessions on those.

  - type: dropdown
    id: agent
    attributes:
      label: CLI
      options:
        - Claude Code
        - Codex
        - OpenCode
        - GitHub Copilot
    validations:
      required: true

  - type: input
    id: cli-now
    attributes:
      label: CLI version now
      description: "`claude --version`, `codex --version`, `opencode --version` or `copilot --version`"
    validations:
      required: true

  - type: input
    id: cli-before
    attributes:
      label: Last version that worked
      description: If you know it.

  - type: textarea
    id: what
    attributes:
      label: What broke
      description: For example sessions not seen as live, a stage or context fill stuck, limits not shown, a session not started or not resumed.
    validations:
      required: true

  - type: textarea
    id: changed
    attributes:
      label: What the CLI does differently
      description: If you looked — a changed field in `claude agents --json`, a new line in the transcript or the JSON events, a different `/usage` text. Paste the relevant piece, not whole files.
      render: text

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
        - WSL
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Even Keel version
      description: The version in the gear menu of the page header, or `git rev-parse --short HEAD` of your clone.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Service log
      description: |
        The lines around the problem: `logs/even-keel.log` in the data folder (`%LOCALAPPDATA%\even-keel` on Windows, `~/Library/Application Support/even-keel` on macOS) or in your clone; `journalctl --user -u even-keel` for the Linux service; the terminal when it runs in one.
        **Remove anything personal first**: task titles and texts, repository paths, host names, account names, emails and any token.
      render: text
