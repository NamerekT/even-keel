name: Bug
description: Something in Even Keel does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Stuck installing Even Keel or on its first run? Use the **Stuck on setup** template instead: it asks for much less.
        Broke right after an update of an agent's CLI (Claude Code, Codex, OpenCode, Copilot)? Use **CLI update broke something**.
        A security hole goes to [SECURITY.md](https://github.com/NamerekT/even-keel/blob/main/SECURITY.md), not here.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. A project on GitHub Issues, two tasks, B blocked by A
        2. Start the chain
        3. …
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
        - WSL
    validations:
      required: true

  - type: dropdown
    id: run
    attributes:
      label: How it runs
      options:
        - Installed with npm, as a service (even-keel install)
        - Installed with npm, in a terminal (even-keel)
        - A clone, as a service
        - A clone, npm start
        - A clone, development (npm run dev)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Even Keel version
      description: The version in the gear menu of the page header, or `git rev-parse --short HEAD` of your clone.
    validations:
      required: true

  - type: input
    id: fork
    attributes:
      label: Fork
      description: Leave empty if you run Even Keel from npm or a clone of this repository with no changes of your own; otherwise the link to your fork or a word on what you changed.

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: The agent the task ran on.
      options:
        - Claude Code
        - Codex
        - OpenCode
        - GitHub Copilot
        - Not about a session
    validations:
      required: true

  - type: input
    id: cli
    attributes:
      label: Agent CLI version
      description: "`claude --version`, `codex --version`, `opencode --version` or `copilot --version`; with **CLI version → Checked** on the page, the version shown there."

  - type: dropdown
    id: tracker
    attributes:
      label: Tracker
      options:
        - Huly
        - GitHub Issues
        - GitLab
        - Linear
        - Jira Cloud
        - My own adapter
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Service log
      description: |
        The lines around the problem: `logs/even-keel.log` in the data folder (`%LOCALAPPDATA%\even-keel` on Windows, `~/Library/Application Support/even-keel` on macOS) or in your clone; `journalctl --user -u even-keel` for the Linux service; the terminal when it runs in one.
        **Remove anything personal first**: task titles and texts, repository paths, host names, account names, emails and any token.
      render: text
