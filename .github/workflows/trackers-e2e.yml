name: Tracker contract

# The tracker adapters' contract on live trackers (src/e2e-trackers/, docs/trackers.md, "Contract tests on live trackers",
# BTN-470): one set of cases over each stand of the secret TRACKER_STANDS, each in a test project of its own. A schedule
# fires only on the default branch, so the night checks out `dev`, the next version; a run by hand takes the branch it is
# started on. The stands up only on demand (ON_DEMAND below: self-hosted Huly, BTN-1489) are skipped by the night and run
# alone by hand with `on_demand`, before a release (scripts/huly-contract.sh brings Huly up and down around it). A red
# night and a red last on-demand run on `dev` each hold every release (scripts/nights-green.sh, checked by publish.yml),
# told apart by the run's title.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      on_demand:
        description: Run only the stands up on demand (Huly), brought up for this run
        type: boolean
        default: false

run-name: ${{ inputs.on_demand && 'Huly contract' || 'Tracker contract' }}

permissions:
  contents: read

jobs:
  contract:
    name: trackers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The self-hosted stands (Huly, Forgejo) are reached over the tailnet; without its OAuth client only the stands
      # on the internet may be in TRACKER_STANDS.
      TAILNET_CLIENT: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      # Stand or adapter names, comma-separated (stands.fixture.ts, selectStands).
      ON_DEMAND: huly

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: env.TAILNET_CLIENT != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - run: npm ci

      - run: npm run test:trackers
        env:
          EVEN_KEEL_TRACKER_STANDS: ${{ secrets.TRACKER_STANDS }}
          EVEN_KEEL_TRACKER_STANDS_SKIP: ${{ !inputs.on_demand && env.ON_DEMAND || '' }}
          EVEN_KEEL_TRACKER_STANDS_ONLY: ${{ inputs.on_demand && env.ON_DEMAND || '' }}
