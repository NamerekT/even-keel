name: Tests

# The check of pushes and pull requests; the chain takes the verdict on main from here (`ci.kinds`, docs/ci.md).
# Forgejo ignores this folder while it has its own, run by hand only. A GitHub runner cannot reach the workstation,
# so the service rebuilds through `commands.afterGreen` after this run is green (docs/service.md).
on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
  pull_request:
    branches:
      - main
      - dev
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: changes
        run: sh scripts/ci-code-changed.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}"

      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.changes.outputs.code == 'true'
        run: npm ci

      - if: steps.changes.outputs.code == 'true'
        run: npm run typecheck

      - if: steps.changes.outputs.code == 'true'
        run: npm test

  # The end-to-end scenarios (src/e2e/, docs/chain/e2e.md) beside the unit tests, split over runners by file: Vitest runs
  # files in parallel, not the scenarios inside one, so the longest file is the floor of a shard.
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - id: changes
        run: sh scripts/ci-code-changed.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}"

      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.changes.outputs.code == 'true'
        run: npm ci

      - if: steps.changes.outputs.code == 'true'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
