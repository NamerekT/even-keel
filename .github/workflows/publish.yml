name: Publish

# A release tag publishes the npm packages `even-keel` and `even-keel-badge` (packages/badge) of the same version
# (docs/releases.md, "Publishing to npm"). npm trusts this workflow by OIDC (a trusted publisher of each package on
# npmjs.com: NamerekT/even-keel, publish.yml), so there is no token anywhere. The builds run in `prepack`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1

      - name: The tag names the version of package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$version of package.json" >&2
            exit 1
          fi

      # A red night of the real CLIs or of the tracker contract holds the release; once a run is green again, re-run this.
      - name: The nightly workflows are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/nights-green.sh

      - run: npm ci

      # A version already on npm is skipped, so a re-run after a failure publishes only what is missing.
      - name: npm publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "even-keel@$version" version 2>/dev/null)" ]; then echo "even-keel@$version is published already"; exit 0; fi
          case "$GITHUB_REF_NAME" in
          *-*) npm publish --tag next ;;
          *) npm publish ;;
          esac

      # The badge's drawing for its Worker: released with Even Keel, under its version.
      - name: npm publish even-keel-badge
        working-directory: packages/badge
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "even-keel-badge@$version" version 2>/dev/null)" ]; then echo "even-keel-badge@$version is published already"; exit 0; fi
          npm pkg set version="$version"
          case "$GITHUB_REF_NAME" in
          *-*) npm publish --tag next ;;
          *) npm publish ;;
          esac
