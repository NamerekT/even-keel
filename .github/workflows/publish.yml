name: Publish

# A release tag publishes the npm packages `even-keel` and `even-keel-badge` (packages/badge) of the same version
# (docs/releases.md, "Publishing to npm"). npm trusts this workflow by OIDC (a trusted publisher of each package on
# npmjs.com: NamerekT/even-keel, publish.yml), so there is no token anywhere. The builds run in `prepack`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1

      - name: The tag names the version of package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$version of package.json" >&2
            exit 1
          fi

      # A red night of the real CLIs or of the tracker contract holds the release; once a run is green again, re-run this.
      - name: The nightly workflows are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/nights-green.sh

      - run: npm ci

      # A version already on npm is skipped, so a re-run after a failure publishes only what is missing.
      - name: npm publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "even-keel@$version" version 2>/dev/null)" ]; then echo "even-keel@$version is published already"; exit 0; fi
          case "$GITHUB_REF_NAME" in
          *-*) npm publish --tag next ;;
          *) npm publish ;;
          esac

      # The badge's drawing for its Worker: released with Even Keel, under its version.
      - name: npm publish even-keel-badge
        working-directory: packages/badge
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "even-keel-badge@$version" version 2>/dev/null)" ]; then echo "even-keel-badge@$version is published already"; exit 0; fi
          npm pkg set version="$version"
          case "$GITHUB_REF_NAME" in
          *-*) npm publish --tag next ;;
          *) npm publish ;;
          esac

  image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish the release image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) channel=next ;;
            *) channel=latest ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$version" --tag "$image:$channel" .
