services:
  even-keel:
    image: ghcr.io/namerekt/even-keel:${EVEN_KEEL_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:4747:4747"
      # The port for machines: loopback by default, as the page; EVEN_KEEL_MACHINES_PUBLISH=0.0.0.0 in .env opens it to machines on other hosts.
      - "${EVEN_KEEL_MACHINES_PUBLISH:-127.0.0.1}:4749:4749"
    environment:
      EVEN_KEEL_TOKEN: ${EVEN_KEEL_TOKEN:?Set EVEN_KEEL_TOKEN in .env before starting Even Keel}
    volumes:
      - home:/home/node
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Docker's 10 s would cut the service's own 15 s shutdown (SHUTDOWN_MS) short.
    stop_grace_period: 30s

volumes:
  home:
