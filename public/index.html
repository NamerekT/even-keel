<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baton</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe7; --muted: #9a9892; } }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    pre { white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Baton</h1>
  <p id="status">Подключение…</p>
  <pre id="state"></pre>
  <script>
    const status = document.getElementById('status')
    const state = document.getElementById('state')
    const source = new EventSource('/api/events')
    source.addEventListener('state', (e) => { state.textContent = JSON.stringify(JSON.parse(e.data), null, 2) })
    source.addEventListener('ping', (e) => { status.textContent = 'На связи · ' + JSON.parse(e.data).at })
    source.onopen = () => { status.textContent = 'На связи' }
    source.onerror = () => { status.textContent = 'Нет связи, переподключаюсь…' }
  </script>
</body>
</html>
