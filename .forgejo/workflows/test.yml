name: Tests

# Run by hand only. The check of pushes and pull requests is GitHub's (.github/workflows/test.yml, docs/ci.md): its
# runners take the jobs side by side, the instance's runner takes one at a time. The file stays so that Forgejo does
# not fall back to .github/workflows and run GitHub's workflows on push.
on:
  workflow_dispatch:

jobs:
  test:
    # The `node24` runner label maps to node:24-bookworm: package.json asks for
    # Node 24, the default `docker` label is still on 22.
    runs-on: node24

    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: node24

    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: npm ci
      - run: npm run test:e2e
